name: Sync ChurnGuard to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_REPO_ID != '' }}
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v6

      - name: Check that the fitted model is present
        id: model
        shell: bash
        run: |
          if [[ -f artifacts/churnguard_pipeline.joblib ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Model artifact missing. Add artifacts/churnguard_pipeline.joblib before deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync files to Hugging Face Space
        if: steps.model.outputs.ready == 'true'
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_REPO_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
