name: ChurnGuard checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check for the fitted model artifact
        id: model
        shell: bash
        run: |
          if [[ -f artifacts/churnguard_pipeline.joblib ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Model artifact is not in the repository yet; model-dependent tests are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install application and test dependencies
        if: steps.model.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        if: steps.model.outputs.ready == 'true'
        run: python -m pytest -q

      - name: Explain skipped tests
        if: steps.model.outputs.ready != 'true'
        run: echo "Upload artifacts/churnguard_pipeline.joblib to enable automated model tests."
